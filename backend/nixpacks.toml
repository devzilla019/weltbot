# Railway / Nixpacks build configuration for WeltBot backend
# Clones the Kronos repo alongside the project so `from model import ...` works.

[phases.setup]
nixPkgs = ["python311", "gcc", "git"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "python -m textblob.download_corpora",
]

[phases.build]
cmds = [
  # Fetch the Kronos model repo into the backend dir so `from model import ...` works.
  # Uses the GitHub tarball (no `git` binary required). The app also downloads
  # it at runtime if this step is skipped.
  "test -d Kronos/model || (curl -sL https://codeload.github.com/shiyu-coder/Kronos/tar.gz/refs/heads/master -o /tmp/kronos.tgz && mkdir -p Kronos && tar -xzf /tmp/kronos.tgz -C Kronos --strip-components=1) || true",
  "test -d Kronos/model && echo '[build] Kronos repo ready' || echo '[build] WARNING: Kronos missing — runtime download will retry'",
]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
