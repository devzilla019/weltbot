# Railway / Nixpacks build configuration for WeltBot backend
# Clones the Kronos repo alongside the project so `from model import ...` works.

[phases.setup]
nixPkgs = ["python311", "gcc", "git"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "python -m textblob.download_corpora",
]

[phases.build]
cmds = [
  # Clone Kronos model repo into the backend dir so `from model import ...` works.
  # The app also auto-clones at runtime if this step is skipped.
  "test -d Kronos || git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos || true",
  "test -d Kronos/model && echo '[build] Kronos repo ready' || echo '[build] WARNING: Kronos clone missing — runtime auto-clone will retry'",
]

[start]
cmd = "python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
